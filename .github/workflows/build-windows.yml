name: Build Windows exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Environment info (proves real Windows build)
        shell: pwsh
        run: |
          python --version
          python -c "import platform; print('OS:', platform.platform())"
          python -c "import os; print('WINDIR fonts:', os.path.isdir(os.path.join(os.environ.get('WINDIR','C:/Windows'),'Fonts')))"
          python -c "from app.core.fonts import list_system_fonts, system_font_dirs; print('Font dirs:', system_font_dirs()); fs = list_system_fonts(cyrillic_only=True); print('Cyrillic-capable fonts found:', len(fs)); [print(' -', n, '->', p) for n, p in fs[:15]]"

      - name: Generate test data and run headless tests
        run: |
          python make_test_data.py
          python tests/headless_test.py

      - name: Build exe
        run: pyinstaller diplom.spec --noconfirm

      - name: Smoke check + hash
        shell: pwsh
        run: |
          $exe = "dist/DiplomGenerator.exe"
          if (-not (Test-Path $exe)) { throw "exe not produced" }
          Get-Item $exe | Select-Object Name, Length
          Get-FileHash $exe -Algorithm SHA256 | Format-List

      - name: Run packaged exe --selftest (proves onefile binary works)
        shell: pwsh
        run: |
          # GUI-subsystem exe: launched via Start-Process, report goes to a log file
          $log = Join-Path $env:RUNNER_TEMP "selftest.log"
          if (Test-Path $log) { Remove-Item $log }
          $exe = (Resolve-Path "dist/DiplomGenerator.exe").Path
          $p = Start-Process -FilePath $exe -ArgumentList "--selftest","--selftest-log",$log -Wait -PassThru
          Write-Output "selftest exit code: $($p.ExitCode)"
          if (Test-Path $log) { Get-Content $log } else { Write-Output "NO LOG PRODUCED" }
          if ($p.ExitCode -ne 0) { throw "packaged exe selftest failed" }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DiplomGenerator-exe
          path: dist/DiplomGenerator.exe
          retention-days: 90

      - name: Create / update release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          Write-Output "Release tag: $tag"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag "dist/DiplomGenerator.exe" --clobber
          } else {
            gh release create $tag "dist/DiplomGenerator.exe" `
              --title "DiplomGenerator $tag" `
              --notes "Portable onefile build for Windows x64. Offline, no Python required. Built by GitHub Actions on windows-latest." `
              --latest
          }
