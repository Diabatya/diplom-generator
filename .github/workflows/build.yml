name: Build Windows exe

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build exe
        run: pyinstaller diplom.spec --noconfirm

      - name: Smoke check + hash
        shell: pwsh
        run: |
          $exe = "dist/DiplomGenerator.exe"
          if (-not (Test-Path $exe)) { throw "exe not produced" }
          Get-Item $exe | Select-Object Name, Length
          Get-FileHash $exe -Algorithm SHA256 | Format-List

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DiplomGenerator-exe
          path: dist/DiplomGenerator.exe
          retention-days: 90

      - name: Create / update release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          if ("${{ github.ref_type }}" -ne "tag") {
            $tag = "build-" + "${{ github.run_number }}"
          }
          Write-Output "Release tag: $tag"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag "dist/DiplomGenerator.exe" --clobber
          } else {
            gh release create $tag "dist/DiplomGenerator.exe" `
              --title "DiplomGenerator $tag" `
              --notes "Portable onefile build for Windows x64. Offline, no Python required. Built by GitHub Actions on windows-latest." `
              --latest
          }
